name: Build, push, and deploy Harness

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose.yml
      - .env.example
      - .github/workflows/docker-image.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/**
      # Includes deployment-owned client plugins such as DeepHarness branding.
      - packages/**
      - tenant-control-plane/**
      - vendor/**

permissions:
  contents: read

concurrency:
  group: harness-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud registry
        uses: docker/login-action@v3
        with:
          registry: crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com
          username: nick1986924905
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ github.sha }}
          tags: |
            crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com/linehalo/harness:latest
            crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com/linehalo/harness:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push tenant control plane
        uses: docker/build-push-action@v6
        with:
          context: tenant-control-plane
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com/linehalo/harness:control-plane-latest
            crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com/linehalo/harness:control-plane-sha-${{ github.sha }}
          cache-from: type=gha,scope=tenant-control-plane
          cache-to: type=gha,mode=max,scope=tenant-control-plane

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_NAME: ${{ secrets.SERVER_NAME }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PWD }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKER_PWD }}
      ALIYUN_ID: ${{ secrets.ALIYUN_ID }}
      ALIYUN_SECRET: ${{ secrets.ALIYUN_SECRET }}
      OSS_BUCKET_INPUT: ${{ secrets.OSS_BUCKET }}
      OSS_REGION: ${{ secrets.OSS_REGION || 'cn-shanghai' }}
      OSS_ENDPOINT_INPUT: ${{ secrets.OSS_ENDPOINT }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Install SSH password client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          python -m pip install --disable-pip-version-check boto3==1.39.14

      - name: Provision private OSS storage
        env:
          OSS_BUCKET: ${{ env.OSS_BUCKET_INPUT }}
          OSS_ENDPOINT: ${{ env.OSS_ENDPOINT_INPUT }}
        run: python tenant-control-plane/scripts/provision_oss.py

      - name: Prepare deployment secrets
        run: |
          umask 077
          python - <<'PY'
          import os
          keys = ("ALIYUN_ID", "ALIYUN_SECRET", "OSS_BUCKET", "OSS_ENDPOINT", "OSS_REGION")
          with open(".deploy-secrets.env", "w", encoding="utf-8") as output:
              for key in keys:
                  value = os.environ[key]
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"{key} contains a newline")
                  output.write(f"{key}={value}\n")
          PY

      - name: Prepare deployment directory
        env:
          SSHPASS: ${{ env.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$SERVER_NAME@$SERVER_IP" \
            'mkdir -p "$HOME/deepseek-harness"'

      - name: Upload Docker Compose definition
        env:
          SSHPASS: ${{ env.SERVER_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=accept-new docker-compose.yml \
            "$SERVER_NAME@$SERVER_IP:deepseek-harness/docker-compose.yml"
          sshpass -e scp -o StrictHostKeyChecking=accept-new .deploy-secrets.env \
            "$SERVER_NAME@$SERVER_IP:deepseek-harness/.deploy-secrets.env"

      - name: Log server in to the image registry
        env:
          SSHPASS: ${{ env.SERVER_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new "$SERVER_NAME@$SERVER_IP" \
            'if docker info >/dev/null 2>&1; then
               docker login --username nick1986924905 --password-stdin crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com;
             elif sudo -n docker info >/dev/null 2>&1; then
               sudo -n docker login --username nick1986924905 --password-stdin crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com;
             else
               echo "Docker is unavailable or requires interactive sudo." >&2;
               exit 1;
             fi'

      - name: Pull and restart Harness
        env:
          SSHPASS: ${{ env.SERVER_PASSWORD }}
        run: |
          if [[ ! "$SERVER_IP" =~ ^[A-Za-z0-9.:-]+$ ]]; then
            echo "SERVER_IP is not a valid host authority." >&2
            exit 1
          fi
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$SERVER_NAME@$SERVER_IP" \
            "bash -s -- '$SERVER_IP'" <<'REMOTE'
          set -euo pipefail
          trusted_host="$1"
          cd "$HOME/deepseek-harness"
          umask 077

          if [[ ! -f .env ]]; then
            if command -v openssl >/dev/null 2>&1; then
              access_password="$(openssl rand -hex 24)"
            else
              access_password="$(head -c 24 /dev/urandom | base64 | tr -d '\n')"
            fi
            control_plane_password="$access_password"
            {
              echo 'HARNESS_PORT=8080'
              echo 'HARNESS_IMAGE_TAG=latest'
              echo 'DSH_ACCESS_USER=admin'
              printf 'DSH_ACCESS_PASSWORD=%s\n' "$access_password"
              printf 'DSH_TRUSTED_HOST=%s\n' "$trusted_host"
              echo 'CONTROL_PLANE_PORT=8090'
              echo 'CONTROL_PLANE_IMAGE_TAG=control-plane-latest'
              echo 'CONTROL_PLANE_ADMIN_USER=admin'
              printf 'CONTROL_PLANE_ADMIN_PASSWORD=%s\n' "$control_plane_password"
              printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)"
              printf 'CONTROL_PLANE_SECRET_KEY=%s\n' "$(openssl rand -base64 32 | tr '+/' '-_')"
              printf 'CONTROL_PLANE_PUBLIC_HOST=%s\n' "$trusted_host"
              echo 'TENANT_PUBLIC_SCHEME=http'
              echo 'TENANT_PORT_START=8100'
              echo 'TENANT_PORT_END=8199'
            } > .env
          else
            if grep -q '^DSH_TRUSTED_HOST=' .env; then
              sed -i "s/^DSH_TRUSTED_HOST=.*/DSH_TRUSTED_HOST=$trusted_host/" .env
            else
              printf 'DSH_TRUSTED_HOST=%s\n' "$trusted_host" >> .env
            fi
            if grep -q '^CONTROL_PLANE_PUBLIC_HOST=' .env; then
              sed -i "s/^CONTROL_PLANE_PUBLIC_HOST=.*/CONTROL_PLANE_PUBLIC_HOST=$trusted_host/" .env
            else
              printf 'CONTROL_PLANE_PUBLIC_HOST=%s\n' "$trusted_host" >> .env
            fi
            if ! grep -q '^CONTROL_PLANE_ADMIN_PASSWORD=' .env; then
              control_plane_password="$(sed -n 's/^DSH_ACCESS_PASSWORD=//p' .env | head -1)"
              if [[ -z "$control_plane_password" ]]; then
                if command -v openssl >/dev/null 2>&1; then
                  control_plane_password="$(openssl rand -hex 24)"
                else
                  control_plane_password="$(head -c 24 /dev/urandom | base64 | tr -d '\n')"
                fi
              fi
              {
                echo 'CONTROL_PLANE_PORT=8090'
                echo 'CONTROL_PLANE_IMAGE_TAG=control-plane-latest'
                echo 'CONTROL_PLANE_ADMIN_USER=admin'
                printf 'CONTROL_PLANE_ADMIN_PASSWORD=%s\n' "$control_plane_password"
                echo 'TENANT_PUBLIC_SCHEME=http'
                echo 'TENANT_PORT_START=8100'
                echo 'TENANT_PORT_END=8199'
              } >> .env
            fi
            if ! grep -q '^POSTGRES_PASSWORD=' .env; then
              printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> .env
            fi
            if ! grep -q '^CONTROL_PLANE_SECRET_KEY=' .env; then
              printf 'CONTROL_PLANE_SECRET_KEY=%s\n' "$(openssl rand -base64 32 | tr '+/' '-_')" >> .env
            fi
          fi

          secret_keys='^(ALIYUN_ID|ALIYUN_SECRET|OSS_BUCKET|OSS_ENDPOINT|OSS_REGION)='
          grep -Ev "$secret_keys" .env > .env.next
          cat .deploy-secrets.env >> .env.next
          mv .env.next .env
          rm -f .deploy-secrets.env

          if docker info >/dev/null 2>&1; then
            docker compose pull harness postgres tenant-control-plane control-plane-backup
            docker compose up -d --remove-orphans
            docker compose ps
            compose_cmd=(docker compose)
          else
            sudo -n docker compose pull harness postgres tenant-control-plane control-plane-backup
            sudo -n docker compose up -d --remove-orphans
            sudo -n docker compose ps
            compose_cmd=(sudo -n docker compose)
          fi

          for attempt in {1..30}; do
            health="$(${compose_cmd[@]} exec -T tenant-control-plane python -c \
              "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3).read().decode())" \
              2>/dev/null || true)"
            if [[ "$health" == *'"status":"ok"'* ]]; then
              printf '%s\n' "$health"
              exit 0
            fi
            sleep 2
          done
          ${compose_cmd[@]} logs --tail=100 postgres tenant-control-plane control-plane-backup
          echo 'Control-plane dependencies did not become healthy.' >&2
          exit 1
          REMOTE
