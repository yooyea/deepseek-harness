name: Build and push Harness image

on:
  workflow_dispatch:
  push:
    branches:
      - agent/docker-image
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker-image.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/**
      - packages/**
      - vendor/**

permissions:
  contents: read

concurrency:
  group: harness-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud registry
        uses: docker/login-action@v3
        with:
          registry: crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com
          username: nick1986924905
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com/linehalo/harness:latest
            crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com/linehalo/harness:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
