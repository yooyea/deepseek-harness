name: Build, push, and deploy Harness

on:
  workflow_dispatch:
  # One-shot connector fallback; only the exact merged PR marker below may run jobs.
  pull_request_target:
    types: [edited]
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose.yml
      - .env.example
      - .github/workflows/docker-image.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/**
      # Includes deployment-owned client plugins such as DeepHarness branding.
      - packages/**
      - vendor/**

permissions:
  contents: read

concurrency:
  group: harness-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name != 'pull_request_target' || (github.event.pull_request.number == 2 && contains(github.event.pull_request.title, '[deploy-9fc45d9]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud registry
        uses: docker/login-action@v3
        with:
          registry: crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com
          username: nick1986924905
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com/linehalo/harness:latest
            crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com/linehalo/harness:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_NAME: ${{ secrets.SERVER_NAME }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PWD }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKER_PWD }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Install SSH password client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Prepare deployment directory
        env:
          SSHPASS: ${{ env.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$SERVER_NAME@$SERVER_IP" \
            'mkdir -p "$HOME/deepseek-harness"'

      - name: Upload Docker Compose definition
        env:
          SSHPASS: ${{ env.SERVER_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=accept-new docker-compose.yml \
            "$SERVER_NAME@$SERVER_IP:deepseek-harness/docker-compose.yml"

      - name: Log server in to the image registry
        env:
          SSHPASS: ${{ env.SERVER_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new "$SERVER_NAME@$SERVER_IP" \
            'if docker info >/dev/null 2>&1; then
               docker login --username nick1986924905 --password-stdin crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com;
             elif sudo -n docker info >/dev/null 2>&1; then
               sudo -n docker login --username nick1986924905 --password-stdin crpi-nwybe4ublujm62d9.cn-hongkong.personal.cr.aliyuncs.com;
             else
               echo "Docker is unavailable or requires interactive sudo." >&2;
               exit 1;
             fi'

      - name: Pull and restart Harness
        env:
          SSHPASS: ${{ env.SERVER_PASSWORD }}
        run: |
          if [[ ! "$SERVER_IP" =~ ^[A-Za-z0-9.:-]+$ ]]; then
            echo "SERVER_IP is not a valid host authority." >&2
            exit 1
          fi
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$SERVER_NAME@$SERVER_IP" \
            "bash -s -- '$SERVER_IP'" <<'REMOTE'
          set -euo pipefail
          trusted_host="$1"
          cd "$HOME/deepseek-harness"
          umask 077

          if [[ ! -f .env ]]; then
            if command -v openssl >/dev/null 2>&1; then
              access_password="$(openssl rand -hex 24)"
            else
              access_password="$(head -c 24 /dev/urandom | base64 | tr -d '\n')"
            fi
            {
              echo 'HARNESS_PORT=8080'
              echo 'HARNESS_IMAGE_TAG=latest'
              echo 'DSH_ACCESS_USER=admin'
              printf 'DSH_ACCESS_PASSWORD=%s\n' "$access_password"
              printf 'DSH_TRUSTED_HOST=%s\n' "$trusted_host"
            } > .env
          elif grep -q '^DSH_TRUSTED_HOST=' .env; then
            sed -i "s/^DSH_TRUSTED_HOST=.*/DSH_TRUSTED_HOST=$trusted_host/" .env
          else
            printf 'DSH_TRUSTED_HOST=%s\n' "$trusted_host" >> .env
          fi

          if docker info >/dev/null 2>&1; then
            docker compose pull harness
            docker compose up -d --remove-orphans
            docker compose ps
          else
            sudo -n docker compose pull harness
            sudo -n docker compose up -d --remove-orphans
            sudo -n docker compose ps
          fi
          REMOTE
