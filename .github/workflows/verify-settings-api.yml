name: Verify privileged settings APIs

on:
  push:
    branches:
      - agent/docker-image
    paths:
      - .github/workflows/verify-settings-api.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_NAME: ${{ secrets.SERVER_NAME }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PWD }}
    steps:
      - name: Install SSH password client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Verify settings and credentials APIs
        env:
          SSHPASS: ${{ env.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$SERVER_NAME@$SERVER_IP" \
            "bash -s -- '$SERVER_IP'" <<'REMOTE'
          set -euo pipefail
          public_host="$1"
          cd "$HOME/deepseek-harness"
          set -a
          source .env
          set +a

          port="${HARNESS_PORT:-8080}"
          user="${DSH_ACCESS_USER:-admin}"
          base="http://127.0.0.1:$port"
          origin="http://$public_host:$port"

          settings_status="$(curl -sS -o /tmp/dsh-settings-response.json -w '%{http_code}' \
            --user "$user:$DSH_ACCESS_PASSWORD" \
            -H "Host: $public_host:$port" \
            -H "Origin: $origin" \
            -H 'Content-Type: application/json' \
            --data '{"type":"client-request","rpcId":"verify-settings","method":"settings.describe","payload":{}}' \
            "$base/api/settings.describe")"

          credentials_status="$(curl -sS -o /tmp/dsh-credentials-response.json -w '%{http_code}' \
            --user "$user:$DSH_ACCESS_PASSWORD" \
            -H "Host: $public_host:$port" \
            -H "Origin: $origin" \
            -H 'Content-Type: application/json' \
            --data '{"type":"client-request","rpcId":"verify-credentials","method":"credentials.describe","payload":{"refs":["DEEPSEEK_API_KEY"]}}' \
            "$base/api/credentials.describe")"

          echo "settings_status=$settings_status"
          echo "credentials_status=$credentials_status"
          test "$settings_status" = '200'
          test "$credentials_status" = '200'

          if docker info >/dev/null 2>&1; then
            docker_cmd=(docker)
          else
            docker_cmd=(sudo -n docker)
          fi
          "${docker_cmd[@]}" exec -i deepseek-harness node -e \
            "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const r=JSON.parse(s);if(r.result?.ok!==true)process.exit(1)})" \
            < /tmp/dsh-settings-response.json
          "${docker_cmd[@]}" exec -i deepseek-harness node -e \
            "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const r=JSON.parse(s);if(r.result?.ok!==true)process.exit(1)})" \
            < /tmp/dsh-credentials-response.json

          rm -f /tmp/dsh-settings-response.json /tmp/dsh-credentials-response.json
          echo 'privileged_api_verified=true'
          REMOTE
